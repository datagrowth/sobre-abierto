# Sobre Abierto en Coolify: el Compose de la raíz sin puerto publicado (Coolify enruta el dominio al monitor).
# Generado con `node deploy/generar.mjs` a partir de docker-compose.yml: no lo edites a mano. Pasos en deploy/README.md.

# Docker guarda los logs sin límite por defecto: sin tope, unos pocos contenedores llegan a ocupar
# gigas de disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: '50m'
    max-file: '3'

services:
  # Antes de cada arranque prepara el volumen de Hermes (ver infra/hermes-init/init.sh):
  # instala las skills de la plataforma en Hermes y en cada perfil, crea un token por agente
  # (/opt/data/.agentes) y lo deja como PLATAFORMA_TOKEN en su .env, y devuelve al usuario de
  # Hermes (uid 10000) los archivos que no sean suyos.
  hermes-init:
    image: ghcr.io/datagrowth/sobre-abierto-hermes-init:${SOBRE_ABIERTO_VERSION:-latest}
    user: '0:0'
    restart: 'no'
    logging: *logging
    volumes:
      - hermes_data:/opt/data

  hermes:
    image: nousresearch/hermes-agent:${HERMES_IMAGE_TAG:-v2026.9.24}
    restart: unless-stopped
    logging: *logging
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    command: gateway run
    # Solo la red de este Compose: el monitor llega a 9119 y 8642 por ella y nada se publica.
    expose:
      - '9119'
      - '8642'
    environment:
      - HERMES_DASHBOARD=${HERMES_DASHBOARD:-1}
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_BASIC_AUTH_SECRET:-}
      - API_SERVER_ENABLED=${API_SERVER_ENABLED:-true}
      - API_SERVER_HOST=${API_SERVER_HOST:-0.0.0.0}
      # Obligatoria: sin clave, cualquiera que llegue al puerto 8642 lanza trabajos.
      - API_SERVER_KEY=${API_SERVER_KEY:?Define API_SERVER_KEY}
    volumes:
      - hermes_data:/opt/data
      # Conocimiento en solo lectura: Hermes propone notas por el MCP, no escribe en la Biblioteca, y
      # lo que borrara se propagaría a Drive. El monitor y drive-sync lo ven en lectura-escritura.
      # Pide Docker Engine 26 o superior (subruta de un volumen).
      - type: volume
        source: hermes_data
        target: /opt/data/conocimiento
        read_only: true
        volume:
          subpath: conocimiento
    # El registro de agentes (tokens y permisos.json) es del monitor: oculto para Hermes, que solo
    # necesita el token de su propio perfil. Los perfiles comparten contenedor y no son una frontera
    # de seguridad entre sí (docs/como-esta-hecho/arquitectura.md, «Seguridad»).
    tmpfs:
      - /opt/data/.agentes
    # Sin privilegios de más: la imagen arranca como root y baja al usuario del agente.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
          # El agente ejecuta comandos: un bucle de procesos no debe agotar los PID del
          # host. Cuentan también los hilos (navegador, Python), de ahí el margen.
          pids: 1024

  monitor:
    image: ghcr.io/datagrowth/sobre-abierto-monitor:${SOBRE_ABIERTO_VERSION:-latest}
    restart: unless-stopped
    logging: *logging
    depends_on:
      hermes:
        condition: service_started
      hermes-init:
        condition: service_completed_successfully
    # Mismo uid:gid con el que Hermes ejecuta el agente: así puede leer sus archivos
    # y nunca deja en el volumen archivos de root que Hermes no pueda abrir. Debe ser
    # 10000:10000: hermes-init devuelve el volumen a ese uid y la imagen de drive-sync
    # prepara su estado para él.
    user: '${MONITOR_USER:-10000:10000}'
    # El panel publica el servicio: no hace falta el 127.0.0.1:3110 del Compose base.
    environment:
      APP_PORT: '3110'
      HOST: 0.0.0.0
      HERMES_HOME: /opt/data
      HERMES_BASE_URL: http://hermes:9119
      # Credenciales con las que el monitor entra en el dashboard de Hermes (Consola).
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?Define HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?Define HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      # Login del propio monitor: credenciales distintas, que el servicio hermes no
      # recibe. Con las del dashboard, un Hermes manipulado las leería de su entorno y
      # entraría en el monitor.
      MONITOR_BASIC_AUTH_USERNAME: ${MONITOR_BASIC_AUTH_USERNAME:?Define MONITOR_BASIC_AUTH_USERNAME}
      MONITOR_BASIC_AUTH_PASSWORD: ${MONITOR_BASIC_AUTH_PASSWORD:?Define MONITOR_BASIC_AUTH_PASSWORD}
      MONITOR_SESSION_SECRET: ${MONITOR_SESSION_SECRET:?Define MONITOR_SESSION_SECRET}
      # Variable mágica de Coolify: da un dominio al servicio «monitor» y lo enruta a su puerto 3110.
      SERVICE_FQDN_MONITOR_3110: ''
      # Un salto de proxy (Traefik): el bloqueo de login usa la IP real.
      MONITOR_PROXIES_DE_CONFIANZA: '1'
      HERMES_VAULT_CONFIG_PATH: /vault/hermes-vault.config.json
      # La Biblioteca es la carpeta Conocimiento de Drive (drive-sync la mantiene al
      # día). Está en el volumen de Hermes para que él también pueda leerla.
      VAULT_PATH: ${HERMES_VAULT_PATH:-/opt/data/conocimiento}
      # Carpeta Salidas de Drive (la sincroniza drive-sync): Hermes escribe ahí los
      # borradores de propuestas y el monitor comprueba, lee y sirve lo que hay dentro.
      SALIDAS_DIR: ${SALIDAS_DIR:-/opt/data/salidas}
      # Índice (texto y vectores) y modelo de embeddings: fuera de la bóveda y del
      # volumen de Hermes, porque no van a Drive ni a las copias de seguridad.
      BIBLIOTECA_INDEX_DIR: /vault/index
      BIBLIOTECA_MODELS_DIR: /vault/models
      # LibreOffice (va en la imagen): lee los .doc de la PLACSP y pagina las memorias. 0 lo
      # apaga si da problemas de memoria; la caché de .doc convertidos no va a Drive.
      LIBREOFFICE_ACTIVO: ${LIBREOFFICE_ACTIVO:-1}
      CONVERSIONES_DIR: /vault/cache/conversiones
      # OCR de los PDF escaneados al indexarlos (tesseract y pdftoppm, en la imagen). 0 lo apaga.
      OCR_ACTIVO: ${OCR_ACTIVO:-1}
      # Token antiguo de la Biblioteca (lo crea hermes-init): vale como agente «hermes».
      BIBLIOTECA_TOKEN_FILE: /opt/data/.biblioteca-token
      # Plataforma: bases de datos (núcleo y dominios) fuera del volumen de Hermes,
      # tokens por agente (los crea hermes-init) y agentes de fuera (Claude Code).
      PLATAFORMA_DATA_DIR: /datos
      AGENTES_DIR: /opt/data/.agentes
      AGENTE_TOKEN_CLAUDE_CODE: ${AGENTE_TOKEN_CLAUDE_CODE:-}
      # Runs de Hermes a la vez en la cola de IA (1-8).
      HERMES_RUNS_A_LA_VEZ: ${HERMES_RUNS_A_LA_VEZ:-2}
      AGENTES_PETICIONES_MINUTO: ${AGENTES_PETICIONES_MINUTO:-120}
      # Perfil de Hermes que hace la criba y los análisis (API de runs); vacío = la
      # IA queda en espera y el radar funciona igual (ver docs/operar/perfiles-de-hermes.md).
      HERMES_LICITACIONES_URL: ${HERMES_LICITACIONES_URL:-}
      HERMES_LICITACIONES_KEY: ${HERMES_LICITACIONES_KEY:-}
      # Perfil de Hermes para preparar ofertas (otro modelo); vacío = el de licitaciones.
      HERMES_OFERTA_LICITACIONES_URL: ${HERMES_OFERTA_LICITACIONES_URL:-}
      HERMES_OFERTA_LICITACIONES_KEY: ${HERMES_OFERTA_LICITACIONES_KEY:-}
      # Perfil del crítico ciego de la memoria técnica (otro modelo); vacío = critica el de oferta.
      HERMES_OFERTA_CRITICO_URL: ${HERMES_OFERTA_CRITICO_URL:-}
      HERMES_OFERTA_CRITICO_KEY: ${HERMES_OFERTA_CRITICO_KEY:-}
      LICITACIONES_ACTIVO: ${LICITACIONES_ACTIVO:-1}
      LICITACIONES_SYNC_MINUTES: ${LICITACIONES_SYNC_MINUTES:-15}
      LICITACIONES_CRIBAS_DIA: ${LICITACIONES_CRIBAS_DIA:-2}
      LICITACIONES_MAX_PAGINAS: ${LICITACIONES_MAX_PAGINAS:-10}
      LICITACIONES_FICHA_AUTO: ${LICITACIONES_FICHA_AUTO:-1}
      LICITACIONES_LOTE_CRIBA: ${LICITACIONES_LOTE_CRIBA:-40}
      # Histórico y precios: sin pasarlas aquí, ponerlas en el .env no llega al monitor.
      LICITACIONES_HISTORICO_DESDE: ${LICITACIONES_HISTORICO_DESDE:-2018}
      LICITACIONES_HISTORICO_TODO: ${LICITACIONES_HISTORICO_TODO:-0}
      LICITACIONES_PRECIOS_MINIMO: ${LICITACIONES_PRECIOS_MINIMO:-20}
      # Horas antes del plazo para firmar y presentar: no se pide a Hermes lo que acabaría dentro.
      LICITACIONES_MARGEN_FIRMA_HORAS: ${LICITACIONES_MARGEN_FIRMA_HORAS:-2}
      # Topes por oferta y 24 h: runs automáticos y propuestas de decisiones pedidas solas.
      LICITACIONES_RUNS_OFERTA_DIA: ${LICITACIONES_RUNS_OFERTA_DIA:-40}
      LICITACIONES_PROPUESTAS_DIA: ${LICITACIONES_PROPUESTAS_DIA:-3}
      LICITACIONES_ACTAS_MERCADO_DIA: ${LICITACIONES_ACTAS_MERCADO_DIA:-5}
      # Memoria técnica: umbral del crítico y rondas de reescritura.
      LICITACIONES_MEMORIA_UMBRAL: ${LICITACIONES_MEMORIA_UMBRAL:-0.9}
      LICITACIONES_MEMORIA_RONDAS: ${LICITACIONES_MEMORIA_RONDAS:-3}
      # DEUC en XML para importarlo en el servicio DEUC: apagado (0) hasta comprobarlo a mano con uno real.
      LICITACIONES_DEUC_XML: ${LICITACIONES_DEUC_XML:-0}
      # Opcional: euros de cada compromiso en la ficha de solución (solo para la persona).
      LICITACIONES_PRECIO_HORA: ${LICITACIONES_PRECIO_HORA:-}
      # Carpetas dentro de Conocimiento: lo que baja el radar y lo que hemos presentado.
      LICITACIONES_CARPETA_RADAR: ${LICITACIONES_CARPETA_RADAR:-Licitaciones/Radar}
      LICITACIONES_CARPETA_PRESENTADAS: ${LICITACIONES_CARPETA_PRESENTADAS:-Licitaciones/Presentadas}
      # Avisos por email (resumen semanal, plazos, resoluciones, búsquedas guardadas): el SMTP del
      # correo de la empresa. Sin SMTP_HOST no sale ningún email (ver docs/operar/correo-calendario-api.md).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PUERTO: ${SMTP_PUERTO:-587}
      SMTP_TLS: ${SMTP_TLS:-0}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CONTRASENA: ${SMTP_CONTRASENA:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
      # La dirección pública de la web (enlaces de los avisos y del calendario) y la de su código
      # fuente (aviso de la AGPL; vacía, el repositorio público). La marca va en Ajustes › Marca.
      APP_URL: ${APP_URL:-}
      APP_SOURCE_URL: ${APP_SOURCE_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
      # Botón "Drive" del monitor: conecta la cuenta y elige la carpeta; lo guarda
      # en DRIVE_STATE_DIR, que drive-sync lee (ver docs/operar/drive.md).
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      DRIVE_STATE_DIR: /drive-state
    volumes:
      # Lectura-escritura a propósito: SQLite en modo WAL necesita el archivo
      # -shm incluso para leer. El monitor abre state.db en readonly y no escribe.
      - hermes_data:/opt/data
      - vault_data:/vault
      - drive_sync_state:/drive-state
      # Bases de datos de la plataforma: fuera de /opt/data, porque hermes-init le
      # cambia el dueño en cada arranque y la copia diaria lo empaqueta a pelo.
      - plataforma_data:/datos
    # Los perfiles de Hermes llegan al MCP del monitor con este nombre (config.yaml de cada perfil).
    networks:
      default:
        aliases:
          - hermes-monitor
    # Corre como 10000:10000: no necesita ninguna capacidad ni hacer setuid.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # El modelo de embeddings y los vectores de los documentos ocupan unos cientos
          # de MB más que el monitor solo; un soffice convirtiendo, ~250 MB de pico.
          memory: 3G
          cpus: '1.0'

  # Google Drive en ambos sentidos: Conocimiento (la Biblioteca), las skills de la empresa
  # (conectadas a Hermes) y Salidas; más una copia diaria de /opt/data. Opcional: solo con
  # `--profile drive`. Sin él, la Biblioteca y las carpetas de las licitaciones viven en el disco
  # del servidor. Espera sin hacer nada hasta que conectes Drive desde Ajustes › Drive.
  drive-sync:
    image: ghcr.io/datagrowth/sobre-abierto-drive-sync:${SOBRE_ABIERTO_VERSION:-latest}
    profiles: [drive]
    restart: unless-stopped
    logging: *logging
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    # Mismo uid que Hermes y el monitor: los archivos que baja de Drive son suyos.
    user: '${MONITOR_USER:-10000:10000}'
    environment:
      GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      # Nombre de cada carpeta en Drive → su carpeta en Hermes. DRIVE_SYNC_EXTRA añade otras con
      # el mismo formato («Nombre=/opt/data/ruta;…»).
      GDRIVE_SYNC: '${DRIVE_CARPETA_CONOCIMIENTO:-Conocimiento}=/opt/data/conocimiento;${DRIVE_CARPETA_SKILLS:-Skills}=/opt/data/skills/empresa;${DRIVE_CARPETA_SALIDAS:-Salidas}=/opt/data/salidas;${DRIVE_SYNC_EXTRA:-}'
      GDRIVE_SYNC_INTERVAL: ${GDRIVE_SYNC_INTERVAL:-60}
      GDRIVE_BACKUP_SOURCE: /opt/data
      # Bases de datos de la plataforma, copiadas con la API de backup de SQLite.
      PLATAFORMA_BACKUP_DIR: /datos
      # 0 = sin copia a Drive (p. ej. si ya hay copia del VPS); ver docs/operar/drive.md.
      GDRIVE_BACKUP: ${GDRIVE_BACKUP:-1}
      # diaria | semanal | no: el histórico se reconstruye desde la PLACSP y la BDNS.
      GDRIVE_BACKUP_PLATAFORMA: ${GDRIVE_BACKUP_PLATAFORMA:-semanal}
      GDRIVE_BACKUP_HOUR: ${GDRIVE_BACKUP_HOUR:-4}
      GDRIVE_BACKUP_KEEP_DAYS: ${GDRIVE_BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - hermes_data:/opt/data
      - drive_sync_state:/state
      # Lectura-escritura a propósito: solo lee las bases para la copia, pero en modo WAL
      # SQLite necesita crear el -shm; montado :ro, la copia falla con el monitor parado.
      - plataforma_data:/datos
    # Corre como 10000:10000 sobre archivos de ese uid (hermes-init devuelve el volumen
    # a él): no cambia dueños ni permisos ajenos, así que no necesita capacidades.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

volumes:
  hermes_data:
  vault_data:
  drive_sync_state:
  plataforma_data:
