name: release

# Al crear un tag vX.Y.Z publica las tres imágenes en GHCR (amd64 y arm64, con procedencia y SBOM)
# y abre la release en GitHub. El Compose de la raíz las descarga sin compilar.
#
# Paso manual tras el PRIMER tag: GHCR crea los paquetes privados. Hasta ponerlos públicos (github.com/orgs/
# datagrowth/packages › cada sobre-abierto-* › Package settings › Change visibility), `docker compose pull`
# de cualquiera de fuera da «denied». GitHub no lo permite hacer desde la API ni desde este workflow.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRO: ghcr.io/datagrowth

jobs:
  imagenes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Procedencia firmada de cada imagen (provenance de buildx).
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagen: sobre-abierto-monitor
            contexto: .
            dockerfile: infra/Dockerfile
          - imagen: sobre-abierto-hermes-init
            contexto: infra/hermes-init
            dockerfile: infra/hermes-init/Dockerfile
          - imagen: sobre-abierto-drive-sync
            contexto: infra/drive-sync
            dockerfile: infra/drive-sync/Dockerfile
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # v1.2.3 → 1.2.3, 1.2 y latest.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRO }}/${{ matrix.imagen }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.source=https://github.com/datagrowth/sobre-abierto
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.contexto }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRO }}/${{ matrix.imagen }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: imagenes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Abrir la release con las notas del CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          version="${ETIQUETA#v}"
          # La sección de esta versión en CHANGELOG.md; si no existe, las notas que genera GitHub.
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {dentro=1; next} index($0, "## [") == 1 {dentro=0} dentro' CHANGELOG.md > notas.md
          if [ -s notas.md ]; then
            gh release create "$ETIQUETA" --title "$ETIQUETA" --notes-file notas.md
          else
            gh release create "$ETIQUETA" --title "$ETIQUETA" --generate-notes
          fi
      # Las sumas de los archivos que baja install.sh, como asset de la release: el instalador las
      # comprueba al instalar y al actualizar (--actualizar).
      - name: Publicar SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          sha256sum docker-compose.yml deploy/docker-compose.caddy.yml deploy/docker-compose.llm-local.yml .env.example infra/perfiles.sh install.sh > SHA256SUMS
          gh release upload "$ETIQUETA" SHA256SUMS
